" stroke="#5DB8F5" stroke-width="2.6923076923076925" width="6.3" x="836.85" y="585.1" /><text fill="#102D42" font-family="Inter, Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" x="882" y="576">Clinical record</text><text fill="#57738A" font-family="Inter, Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" x="882" y="608">Admission and discharge dates come from</text><text fill="#57738A" font-family="Inter, Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" x="882" y="631">verified encounters. The reason for return</text><text fill="#57738A" font-family="Inter, Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" x="882" y="654">requires documented evaluation.</text></svg>