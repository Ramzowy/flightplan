#9DBBD0" font-family="Inter, Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="end" x="1525" y="941">12 / 18</text><text fill="#9DBBD0" font-family="Inter, Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="121.5" y="135">Home</text><text fill="#9DBBD0" font-family="Inter, Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="238.5" y="135">Journey</text><text fill="#9DBBD0" font-family="Inter, Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="355.5" y="135">Today</text><text fill="#9DBBD0" font-family="Inter, Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="472.5" y="135">My Care</text><text fill="#9DBBD0" font-family="Inter, Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="589.5" y="135">Rounds</text><rect fill="#20DBCF" height="36" rx="18" ry="18" width="128" x="655" y="111" /><text fill="#102D42" font-family="Inter, Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" x="719.0" y="135">Questions</text><text fill="#9DBBD0" font-family="Inter, Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="848.5" y="135">History</text><rect fill="#19364C" height="642" rx="18" ry="18" stroke="#35536A" stroke-width="1.2" width="900" x="66" y="215" /><text fill="#F6FBFF" font-family="Inter, Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" x="103" y="271">Questions for the care team</text><text fill="#9DBBD0" font-family="Inter, Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" x="102" y="308">Save questions before rounds. These are not emergency messages.</text><rect fill="#DDEEF6" height="83" rx="13" ry="13" width="823" x="102" y="339" /><path d="M132.2 371.9 H153.8 V385.4 H140.84 L133.55 391.61 V385.4 H132.2 Z" fill="none" stroke="#5DB8F5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.076923076923077" /><text fill="#102D42" font-family="Inter, Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" x="183" y="385">Why did Maya need breathing support?</text><rect fill="#DDEEF6" height="83" rx="13" ry="13" width="823" x="102" y="439" /><path d="M132.2 471.9 H153.8 V485.4 H140.84 L133.55 491.61 V485.4 H132.2 Z" fill="none" stroke="#5DB8F5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.076923076923077" /><text fill="#102D42" font-family="Inter, Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" x="183" y="485">What is the next test for?</text><rect fill="#DDEEF6" height="83" rx="13" ry="13" width="823" x="102" y="539" /><path d="M132.2 571.9 H153.8 V585.4 H140.84 L133.55 591.61 V585.4 H132.2 Z" fill="none" stroke="#5DB8F5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.076923076923077" /><text fill="#102D42" font-family="Inter, Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" x="183" y="585">What would need to happen before going home?</text><rect fill="#19364C" height="114" rx="14" ry="14" width="820" x="102" y="664" /><text fill="#9DBBD0" font-family="Inter, Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" x="127" y="700">Add another question...</text><rect fill="#20DBCF" height="44" rx="22.0" ry="22.0" width="245" x="651" y="717" /><text fill="#102D42" font-family="Inter, Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="773.5" y="745.0">Save question</text><rect fill="#19364C" height="642" rx="18" ry="18" stroke="#35536A" stroke-width="1.2" width="532" x="991" y="215" /><text fill="#F6FBFF" font-family="Inter, Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" x="1027" y="273">What families can share</text><rect fill="#19364C" height="161" rx="18" ry="18" stroke="#35536A" stroke-width="1.2" width="460" x="1022" y="309" /><rect fill="none" height="27.650000000000002" rx="3" ry="3" stroke="#20DBCF" stroke-width="2.6923076923076925" width="19.6" x="1061.2" y="348.0" /><line stroke="#20DBCF" stroke-linecap="round" stroke-width="2.6923076923076925" x1="1065.4" x2="1076.6" y1="356.05" y2="356.05" /><line stroke="#20DBCF" stroke-linecap="round" stroke-width="2.6923076923076925" x1="1065.4" x2="1076.6" y1="363.05" y2="363.05" /><line stroke="#20DBCF" stroke-linecap="round" stroke-width="2.6923076923076925" x1="1065.4" x2="1076.6" y1="369.7" y2="369.7" /><text fill="#F6FBFF" font-family="Inter, Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" x="1113" y="355">At-home observations</text><text fill="#9DBBD0" font-family="Inter, Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" x="1113" y="387">Example: symptoms noticed between</text><text fill="#9DBBD0" font-family="Inter, Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" x="1113" y="410">admissions. Label these as family-reported.</text><rect fill="#19364C" height="161" rx="18" ry="18" stroke="#35536A" stroke-width="1.2" width="460" x="1022" y="485" /><path d="M1071 523.3 L1083.25 528.9 V541.85 Q1081.5 549.55 1071 554.8 Q1060.5 549.55 1058.75 541.85 V528.9 Z" fill="none" stroke="#20DBCF" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6923076923076925" /><text fill="#F6FBFF" font-family="Inter, Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" x="1113" y="531">Clinical communication</text><text fill="#9DBBD0" font-family="Inter, Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" x="1113" y="563">No promise of urgent response. Escalation</text><text fill="#9DBBD0" font-family="Inter, Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" x="1113" y="586">uses the hospital’s established channels.</text><text fill="#F3C879" font-family="Inter, Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" x="1028" y="712">Questions only enter the formal record</text><text fill="#F3C879" font-family="Inter, Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" x="1028" y="736">through an approved workflow.</text></svg>